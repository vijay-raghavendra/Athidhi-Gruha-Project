<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Forgot Password</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">

</head>

<body>

<div class="background-container">

    <div class="overlay"></div>

    <div class="forgot-container">

        <div class="forgot-box">

            <h2 class="text-center text-white mb-4">
                Verify Your Identity
            </h2>

            <form id="forgotPasswordForm">

                <div class="mb-3">

                    <label class="form-label text-white">

                        User ID
                        <span class="mandatory">*</span>

                    </label>

                    <input type="text" class="form-control custom-input" id="userId">

                    <small class="error-message" id="userIdError"></small>

                </div>

                <div class="mb-3">

                    <label class="form-label text-white">

                        Date Of Birth
                        <span class="mandatory">*</span>

                    </label>

                    <input type="date" class="form-control custom-input" id="dob">

                    <small class="error-message" id="dobError"></small>

                </div>

                <div class="mb-3">

                    <label class="form-label text-white">

                        Mobile Number
                        <span class="mandatory">*</span>

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            +91
                        </span>

                        <input type="text" class="form-control custom-input" id="mobileNumber" maxlength="10">

                    </div>

                    <small class="error-message" id="mobileNumberError"></small>

                </div>

                <div class="mb-4">

                    <label class="form-label text-white">

                        Email ID
                        <span class="mandatory">*</span>

                    </label>

                    <input type="text" class="form-control custom-input" id="email">

                    <small class="error-message" id="emailError"></small>

                </div>

                <button type="submit" class="btn verify-btn w-100">

                    Verify User

                </button>

                <!-- LOGIN LINK -->

                <div class="text-center mt-3">

                    <a th:href="@{/login}"
                       class="custom-link">

                        Back To Login

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script th:src="@{/js/forgot-password.js}"></script>

</body>

</html>
