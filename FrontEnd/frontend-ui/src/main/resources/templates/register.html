<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Register - Athidhi Gruha</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          th:href="@{/css/register.css}">

    <!-- popup Icon CSS -->
    <link rel="stylesheet" th:href="@{/css/popup.css}">

</head>

<body>

<div class="background-container">

    <div class="overlay"></div>

    <div class="register-container">

        <div class="register-box">

            <h2 class="text-center text-white mb-4">
                User Registration
            </h2>

            <form id="registerForm">

                <div class="row">

                    <!-- FIRST NAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label text-white">

                            First Name
                            <span class="mandatory">*</span>

                        </label>

                        <input type="text"
                               class="form-control custom-input"
                               id="firstName">

                        <small class="error-message"
                               id="firstNameError"></small>

                    </div>

                    <!-- MIDDLE NAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label text-white">

                            Middle Name

                        </label>

                        <input type="text"
                               class="form-control custom-input"
                               id="middleName">

                        <small class="error-message"
                               id="middleNameError"></small>

                    </div>

                    <!-- LAST NAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label text-white">

                            Last Name
                            <span class="mandatory">*</span>

                        </label>

                        <input type="text"
                               class="form-control custom-input"
                               id="lastName">

                        <small class="error-message"
                               id="lastNameError"></small>

                    </div>

                    <!-- ROLE -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label text-white">

                            Role
                            <span class="mandatory">*</span>

                        </label>

                        <select class="form-select custom-input"
                                id="userRole">

                            <option value="">
                                Select
                            </option>

                            <option value="ADMIN">
                                Admin
                            </option>

                            <option value="OWNER">
                                Owner
                            </option>

                            <option value="TENANT">
                                Tenant
                            </option>

                        </select>

                        <small class="error-message"
                               id="userRoleError"></small>

                    </div>

                    <!-- DOB -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label text-white">

                            Date Of Birth
                            <span class="mandatory">*</span>

                        </label>

                        <input type="date"
                               class="form-control custom-input"
                               id="dob">

                        <small class="error-message"
                               id="dobError"></small>

                    </div>

                    <!-- GENDER -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label text-white">

                            Gender
                            <span class="mandatory">*</span>

                        </label>

                        <select class="form-select custom-input"
                                id="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="MALE">
                                Male
                            </option>

                            <option value="FEMALE">
                                Female
                            </option>

                            <option value="OTHER">
                                Other
                            </option>

                        </select>

                        <small class="error-message"
                               id="genderError"></small>

                    </div>

                    <!-- MOBILE -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label text-white">

                            Mobile Number
                            <span class="mandatory">*</span>

                        </label>

                        <div class="input-group">

                <span class="input-group-text">
                    +91
                </span>

                            <input type="text"
                                   class="form-control custom-input"
                                   id="mobileNumber"
                                   maxlength="10">

                        </div>

                        <small class="error-message"
                               id="mobileNumberError"></small>

                    </div>

                    <!-- EMAIL -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label text-white">

                            Email ID
                            <span class="mandatory">*</span>

                        </label>

                        <input type="text"
                               class="form-control custom-input"
                               id="email">

                        <small class="error-message"
                               id="emailError"></small>

                    </div>

                    <!-- PASSWORD SECTION -->

                    <div class="col-md-6">

                        <!-- PASSWORD -->

                        <div class="mb-3 position-relative">

                            <label class="form-label text-white">

                                Password
                                <span class="mandatory">*</span>

                            </label>

                            <input type="password"
                                   class="form-control custom-input"
                                   id="password">

                            <i class="bi bi-eye-slash-fill eye-icon"
                               id="togglePassword"></i>

                            <small class="error-message"
                                   id="passwordError"></small>

                        </div>

                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3 position-relative">

                            <label class="form-label text-white">

                                Confirm Password
                                <span class="mandatory">*</span>

                            </label>

                            <input type="password"
                                   class="form-control custom-input"
                                   id="confirmPassword">

                            <i class="bi bi-eye-slash-fill eye-icon"
                               id="toggleConfirmPassword"></i>

                            <small class="error-message"
                                   id="confirmPasswordError"></small>

                        </div>

                    </div>

                    <!-- PASSWORD RULES -->

                    <div class="col-md-6">

                        <div class="password-rules">

                            <h6>Password Must Contain:</h6>

                            <ul>

                                <li id="ruleLength">
                                    8–18 Characters
                                </li>

                                <li id="ruleUpper">
                                    One Uppercase Letter
                                </li>

                                <li id="ruleLower">
                                    One Lowercase Letter
                                </li>

                                <li id="ruleNumber">
                                    One Number
                                </li>

                                <li id="ruleSpecial">
                                    One Special Character
                                </li>

                            </ul>

                        </div>

                    </div>

                <!-- BUTTON -->

                <button type="submit"
                        class="btn register-btn w-100">

                    Register

                </button>

                <!-- LOGIN LINK -->

                <div class="text-center mt-3">

                    <a th:href="@{/login}"
                       class="custom-link">

                        Already Registered? Login

                    </a>

                </div>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->

<script th:src="@{/js/register.js}"></script>

<!-- popup JS -->
<script th:src="@{/js/popup.js}"></script>

</body>

</html>
