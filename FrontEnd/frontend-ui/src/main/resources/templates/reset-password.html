<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Reset Password</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/reset-password.css}">

    <!-- popup Icon CSS -->
    <link rel="stylesheet" th:href="@{/css/popup.css}">

</head>

<body>

<div class="background-container">

    <div class="overlay"></div>

    <div class="forgot-container">

        <div class="forgot-box">

            <h2 class="text-center text-white mb-4">
                Reset Password
            </h2>

            <form id="resetPasswordForm">

                <div class="mb-3">

                    <div class="mb-3 position-relative">

                        <label class="form-label text-white">

                            New Password
                            <span class="mandatory">*</span>

                        </label>

                        <input type="password"
                               class="form-control custom-input"
                               id="newPassword">

                        <i class="bi bi-eye-slash-fill eye-icon"
                           id="toggleNewPassword"></i>

                        <small class="error-message"
                               id="newPasswordError"></small>

                    </div>

                </div>

                <div class="mb-4">

                    <div class="mb-4 position-relative">

                    <label class="form-label text-white">

                        Confirm Password
                        <span class="mandatory">*</span>

                    </label>

                    <input type="password"
                           class="form-control custom-input"
                           id="confirmPassword">

                    <i class="bi bi-eye-slash-fill eye-icon"
                       id="toggleConfirmPassword"></i>

                    <small class="error-message"
                           id="confirmPasswordError"></small>

                    </div>

                </div>

                <button type="submit"
                        class="btn verify-btn w-100">

                    Reset Password

                </button>

                <!-- LOGIN LINK -->

                <div class="text-center mt-3">

                    <a th:href="@{/login}"
                       class="custom-link">

                        Back To Login

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script th:src="@{/js/reset-password.js}"></script>

<!-- popup JS -->
<script th:src="@{/js/popup.js}"></script>

</body>

</html>
