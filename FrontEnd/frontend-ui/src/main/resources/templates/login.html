<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Athidhi Gruha Login</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- popup Icon CSS -->
    <link rel="stylesheet" th:href="@{/css/popup.css}">

</head>

<body>

<!-- BACKGROUND IMAGE -->

<div class="background-container">

    <!-- DARK OVERLAY -->

    <div class="overlay"></div>

    <!-- LOGIN BOX -->

    <div class="login-container">

        <div class="login-box">

            <h2 class="text-center mb-4 text-white">
                Athidhi Gruha
            </h2>

            <form id="loginForm">

                <!-- USERNAME -->

                <div class="mb-3">

                    <input type="text"
                           class="form-control custom-input"
                           placeholder="Username/UserId"
                           id="userId">

                </div>

                <!-- PASSWORD -->

                <div class="mb-3 position-relative">

                    <input type="password"
                           class="form-control custom-input"
                           placeholder="Password"
                           id="password">

                    <i class="bi bi-eye-slash-fill eye-icon"
                       id="togglePassword"></i>

                </div>

                <!-- LOGIN BUTTON -->

                <button type="submit"
                        class="btn login-btn w-100">

                    Login

                </button>

            </form>

            <!-- REGISTER -->

            <div class="text-center mt-4">

                <a th:href="@{/register}"
                   class="custom-link">

                    New User? Register / Sign Up

                </a>

            </div>

            <!-- FORGOT PASSWORD -->

            <div class="text-center mt-2">

                <a th:href="@{/forgot-password}"
                   class="custom-link">

                    Forgot Password?

                </a>
                /
                <a th:href="@{/findUserDetails}"
                   class="custom-link">

                    UserID?

                </a>

            </div>

        </div>

    </div>

</div>

<!-- JS -->

<script th:src="@{/js/login.js}"></script>

<!-- popup JS -->
<script th:src="@{/js/popup.js}"></script>

</body>

</html>
